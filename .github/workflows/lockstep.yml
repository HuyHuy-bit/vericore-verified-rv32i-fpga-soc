name: Spike Lockstep

on:
  workflow_dispatch:
  push:
    paths:
      - 'rtl/**'
      - 'cpu_tb.cpp'
      - 'Makefile'
      - 'bench/**'
      - 'compliance/**'
      - 'containers/**'
      - '.devcontainer/**'
      - 'tools/**'
      - 'unit/**'
      - 'tests/**'
      - 'results/**'
      - '.github/workflows/lockstep.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - 'cpu_tb.cpp'
      - 'Makefile'
      - 'bench/**'
      - 'compliance/**'
      - 'containers/**'
      - '.devcontainer/**'
      - 'tools/**'
      - 'unit/**'
      - 'tests/**'
      - 'results/**'
      - '.github/workflows/lockstep.yml'

permissions:
  contents: read

jobs:
  lockstep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Restore pinned reference cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .verify-cache
          key: verify-references-${{ hashFiles('tools/reference_versions.env', 'tools/tool_versions.env') }}

      - name: Run complete architecture traces against Spike
        run: python3 tools/verification.py container --profile lockstep

      - name: Run random programs against Spike
        run: python3 tools/verification.py container --profile random-spike
