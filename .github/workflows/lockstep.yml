name: Spike Lockstep

on:
  workflow_dispatch:
  push:
    paths:
      - 'rtl/**'        # only the RTL can change what retires

jobs:
  lockstep:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-riscv64-unknown-elf device-tree-compiler \
                                  libboost-dev libboost-regex-dev libboost-system-dev

      # Ubuntu's apt Verilator (4.038) predates --timing, which the
      # assertions build depends on; conda-forge tracks current releases.
      - name: Install Verilator (conda-forge)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict

      - name: Install verilator package
        run: mamba install -y -c conda-forge verilator

      - name: Cache riscv-arch-test
        id: arch-test-cache
        uses: actions/cache@v4
        with:
          path: ~/riscv-arch-test
          key: riscv-arch-test-old-framework-2.x

      - name: Clone riscv-arch-test
        if: steps.arch-test-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch old-framework-2.x --depth 1 \
            https://github.com/riscv-non-isa/riscv-arch-test.git ~/riscv-arch-test

      # Spike is a source build and slow to compile, so it's cached on its
      # commit-pinned tag rather than rebuilt every run.
      # Pinned to the exact commit every lockstep result in this repo was
      # measured against, rather than tracking master. A reference model that
      # silently changes version is a reference model you can't reason about:
      # a divergence would be ambiguous between "the RTL regressed" and
      # "upstream changed", which is the one question this whole job exists
      # to answer unambiguously. The cache key carries the SHA so re-pinning
      # busts the cache automatically.
      - name: Cache Spike
        id: spike-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/spike
          key: spike-55b4658dbf574ba0b714083ec436ce2cb5be1998

      - name: Build Spike
        if: steps.spike-cache.outputs.cache-hit != 'true'
        run: |
          SPIKE_SHA=55b4658dbf574ba0b714083ec436ce2cb5be1998
          mkdir -p /tmp/spike-src && cd /tmp/spike-src
          git init -q
          git remote add origin https://github.com/riscv-software-src/riscv-isa-sim.git
          git fetch -q --depth 1 origin "$SPIKE_SHA"
          git checkout -q FETCH_HEAD
          mkdir build && cd build
          ../configure --prefix=$HOME/.local/spike
          make -j$(nproc) && make install

      - name: Run lockstep against Spike
        env:
          # $HOME, not "~": a tilde in a YAML env value is a literal string,
          # and neither the shell nor Python expands it on the way through.
          ARCH_TEST: /home/runner/riscv-arch-test
          SPIKE: /home/runner/.local/spike/bin/spike
        run: |
          # Fail early and clearly if the Spike build or cache restore didn't
          # actually produce a binary, rather than 38 confusing divergences.
          test -x "$SPIKE" || { echo "spike missing at $SPIKE"; exit 1; }
          "$SPIKE" --help >/dev/null 2>&1 || true
          make lockstep

      # The compliance programs above are fixed; these are generated fresh and
      # contain branches and jumps, which the Python-model soak cannot produce.
      # ~20 s for 200 seeds, so there's no reason to run fewer in CI than
      # locally. Reuses the obj_dir_lockstep build the previous step made.
      - name: Random programs against Spike (with control flow)
        env:
          SPIKE: /home/runner/.local/spike/bin/spike
        run: make soak-lockstep SEEDS=200
