name: RTL Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'rtl/**'
      - 'cpu_tb.cpp'
      - 'Makefile'
      - 'bench/**'
      - 'compliance/**'
      - 'containers/**'
      - '.devcontainer/**'
      - 'tools/**'
      - 'unit/**'
      - 'tests/**'
      - 'results/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/rtl-tests.yml'
  pull_request:
    paths:
      - 'rtl/**'
      - 'cpu_tb.cpp'
      - 'Makefile'
      - 'bench/**'
      - 'compliance/**'
      - 'containers/**'
      - '.devcontainer/**'
      - 'tools/**'
      - 'unit/**'
      - 'tests/**'
      - 'results/**'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/rtl-tests.yml'

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Run fast correctness in the pinned environment
        run: python3 tools/verification.py container --profile fast

      - name: Run six memory configurations
        run: python3 tools/verification.py container --profile directed-memory

      - name: Run three predictor configurations
        run: python3 tools/verification.py container --profile directed-predictor
