<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0.5 L10,5 L0,9.5 z" fill="#000" style="shape-rendering:geometricPrecision"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0.5 L0,5 L10,9.5 z" fill="#000" style="shape-rendering:geometricPrecision"/>
    </marker>
  </defs>
  <style>
    rect  { fill:#fff; stroke:#000; stroke-width:1; shape-rendering:crispEdges; }
    .grp  { stroke-dasharray:5 4; }
    .w    { fill:none; stroke:#000; stroke-width:1; shape-rendering:crispEdges; }
    .c    { fill:none; stroke:#000; stroke-width:0.8; stroke-dasharray:4 4; shape-rendering:crispEdges; }
    text  { font-family:Helvetica,Arial,sans-serif; font-size:12px; }
    .t    { text-anchor:middle; }
    .s    { font-size:10px; }
    .m    { font-family:"DejaVu Sans Mono",Consolas,monospace; font-size:10px; text-anchor:middle; }
    .h    { font-size:17px; text-anchor:middle; stroke-width:0; }
    .d    { fill:#000; stroke:none; }
  </style>


  <!-- board-level wrapper -->
  <rect x="30" y="60" width="150" height="50"/>

  <rect x="30" y="140" width="150" height="50"/>

  <!-- SoC container -->
  <rect class="grp" x="210" y="60" width="1040" height="540"/>

  <rect x="235" y="230" width="150" height="160"/>

  <rect x="430" y="238" width="140" height="56"/>

  <rect x="430" y="306" width="140" height="56"/>

  <rect x="620" y="250" width="130" height="100"/>

  <rect x="800" y="250" width="140" height="100"/>

  <rect x="1000" y="118" width="230" height="64"/>

  <rect x="1000" y="218" width="230" height="64"/>

  <rect x="1000" y="318" width="230" height="64"/>

  <rect x="1000" y="418" width="230" height="64"/>

  <!-- ===================== links ===================== -->
  <polyline class="w" points="180,85 300,85 300,230" marker-end="url(#a)"/>
  <polyline class="w" points="180,165 340,165 340,230" marker-end="url(#a)"/>

  <polyline class="w" points="385,266 430,266" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="385,334 430,334" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="570,266 620,266" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="570,334 620,334" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="750,300 800,300" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="940,300 975,300"/>
  <polyline class="w" points="975,150 975,450"/>
  <polyline class="w" points="975,150 1000,150" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="975,250 1000,250" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="975,350 1000,350" marker-end="url(#a)" marker-start="url(#b)"/>
  <polyline class="w" points="975,450 1000,450" marker-end="url(#a)" marker-start="url(#b)"/>
  <circle class="d" cx="975" cy="300" r="2.8"/>
  <circle class="d" cx="975" cy="250" r="2.8"/>
  <circle class="d" cx="975" cy="350" r="2.8"/>

  <!-- external interrupt back to the core -->
  <polyline class="c" points="1000,370 960,370 960,560 310,560 310,390" marker-end="url(#a)"/>

  <!-- ===================== labels ===================== -->

  <g class="halo" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round">
  <text class="h" x="640" y="28">rv32i_soc bus fabric</text>
  <text class="t" x="105" y="80">arty_clock</text><text class="s t" x="105" y="96">100 MHz → 50 MHz MMCM</text>
  <text class="t" x="105" y="160">reset_controller</text><text class="s t" x="105" y="176">BTN0</text>
  <text class="s" x="1244" y="76" text-anchor="end">rv32i_soc</text>
  <text class="t" x="310" y="295">rv32i_core</text><text class="s t" x="310" y="313">pipeline, caches,</text><text class="s t" x="310" y="329">predictor, CSRs</text>
  <text class="s t" x="500" y="261">wb_master_adapter</text><text class="s t" x="500" y="277">i_adapter (fetch)</text>
  <text class="s t" x="500" y="329">wb_master_adapter</text><text class="s t" x="500" y="345">d_adapter (load / store)</text>
  <text class="t" x="685" y="295">wb_arbiter</text><text class="s t" x="685" y="312">round-robin</text>
  <text class="t" x="870" y="295">wb_interconnect</text><text class="s t" x="870" y="312">address decode</text>
  <text class="t" x="1115" y="139">wb_imem — 32 KiB BRAM</text>
  <text class="m" x="1115" y="156">0x0000_0000–0x0000_7FFF</text>
  <text class="s t" x="1115" y="172">.text + .rodata</text>
  <text class="t" x="1115" y="239">wb_uart</text>
  <text class="m" x="1115" y="256">0x1000_0000–0x1000_000F</text>
  <text class="s t" x="1115" y="272">transmit-only, 115200 8-N-1</text>
  <text class="t" x="1115" y="339">wb_gpio_irq</text>
  <text class="m" x="1115" y="356">0x1000_1000–0x1000_101F</text>
  <text class="s t" x="1115" y="372">LEDs, debounced BTN1</text>
  <text class="t" x="1115" y="439">wb_dmem — 32 KiB BRAM</text>
  <text class="m" x="1115" y="456">0x2000_0000–0x2000_7FFF</text>
  <text class="s t" x="1115" y="472">.data + .bss + stack</text>
  <text class="s" x="188" y="80">clk 50 MHz</text>
  <text class="s" x="188" y="160">rst</text>
  <text class="s" x="576" y="261">master 0</text>
  <text class="s" x="576" y="329">master 1</text>
  <text class="s" x="754" y="294">grant</text>
  <text class="s" x="944" y="294">decoded</text>
  <text class="s" x="320" y="555">machine-external interrupt</text>
  <text class="s" x="936" y="420">irq</text>
  <text class="s" x="30" y="672">All internal links are 32-bit Wishbone B4 Classic single transfers: CYC / STB / WE / ADR / SEL / DAT_W out, ACK / ERR / DAT_R back. One response per cycle; the arbiter holds ownership through completion.</text>
  <text class="s" x="30" y="690">An unmapped or disallowed request returns ERR instead of hanging. Only 0x2000_0000–0x2000_7FFF is D-cacheable — instruction-BRAM data reads and all MMIO bypass the D-cache.</text>
  <text class="s" x="30" y="708">Dashed = control / interrupt.   The legacy `cpu` wrapper attaches the same core to simulation memories instead of this fabric.</text>
  </g>
  <g fill="#000" stroke="none">
  <text class="h" x="640" y="28">rv32i_soc bus fabric</text>
  <text class="t" x="105" y="80">arty_clock</text><text class="s t" x="105" y="96">100 MHz → 50 MHz MMCM</text>
  <text class="t" x="105" y="160">reset_controller</text><text class="s t" x="105" y="176">BTN0</text>
  <text class="s" x="1244" y="76" text-anchor="end">rv32i_soc</text>
  <text class="t" x="310" y="295">rv32i_core</text><text class="s t" x="310" y="313">pipeline, caches,</text><text class="s t" x="310" y="329">predictor, CSRs</text>
  <text class="s t" x="500" y="261">wb_master_adapter</text><text class="s t" x="500" y="277">i_adapter (fetch)</text>
  <text class="s t" x="500" y="329">wb_master_adapter</text><text class="s t" x="500" y="345">d_adapter (load / store)</text>
  <text class="t" x="685" y="295">wb_arbiter</text><text class="s t" x="685" y="312">round-robin</text>
  <text class="t" x="870" y="295">wb_interconnect</text><text class="s t" x="870" y="312">address decode</text>
  <text class="t" x="1115" y="139">wb_imem — 32 KiB BRAM</text>
  <text class="m" x="1115" y="156">0x0000_0000–0x0000_7FFF</text>
  <text class="s t" x="1115" y="172">.text + .rodata</text>
  <text class="t" x="1115" y="239">wb_uart</text>
  <text class="m" x="1115" y="256">0x1000_0000–0x1000_000F</text>
  <text class="s t" x="1115" y="272">transmit-only, 115200 8-N-1</text>
  <text class="t" x="1115" y="339">wb_gpio_irq</text>
  <text class="m" x="1115" y="356">0x1000_1000–0x1000_101F</text>
  <text class="s t" x="1115" y="372">LEDs, debounced BTN1</text>
  <text class="t" x="1115" y="439">wb_dmem — 32 KiB BRAM</text>
  <text class="m" x="1115" y="456">0x2000_0000–0x2000_7FFF</text>
  <text class="s t" x="1115" y="472">.data + .bss + stack</text>
  <text class="s" x="188" y="80">clk 50 MHz</text>
  <text class="s" x="188" y="160">rst</text>
  <text class="s" x="576" y="261">master 0</text>
  <text class="s" x="576" y="329">master 1</text>
  <text class="s" x="754" y="294">grant</text>
  <text class="s" x="944" y="294">decoded</text>
  <text class="s" x="320" y="555">machine-external interrupt</text>
  <text class="s" x="936" y="420">irq</text>
  <text class="s" x="30" y="672">All internal links are 32-bit Wishbone B4 Classic single transfers: CYC / STB / WE / ADR / SEL / DAT_W out, ACK / ERR / DAT_R back. One response per cycle; the arbiter holds ownership through completion.</text>
  <text class="s" x="30" y="690">An unmapped or disallowed request returns ERR instead of hanging. Only 0x2000_0000–0x2000_7FFF is D-cacheable — instruction-BRAM data reads and all MMIO bypass the D-cache.</text>
  <text class="s" x="30" y="708">Dashed = control / interrupt.   The legacy `cpu` wrapper attaches the same core to simulation memories instead of this fabric.</text>
  </g>
</svg>
